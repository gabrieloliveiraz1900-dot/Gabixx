.splash{position:relative;overflow:hidden}.splash canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

@keyframes li{to{opacity:1;transform:none;filter:none}}

.center{animation:sc .35s ease-out}.ob{animation:sc .35s ease-out}@keyframes sc{from{opacity:0;transform:translateY(12px)}}

.slides{flex:1;display:flex;overflow:hidden;touch-action:pan-y}.track{display:flex;width:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sl{min-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:0 12px}.sl h2{font-size:28px}.sl p{margin:0;color:var(--muted);max-width:300px}
.hero{width:132px;height:132px;border-radius:36px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:12px;box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 16%,transparent);animation:fl 4s ease-in-out infinite}.hero .ic{width:60px;height:60px}@keyframes fl{50%{transform:translateY(-8px)}}
.dotsn{display:flex;justify-content:center;gap:8px;margin:14px 0}.dotsn i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:.3s}.dotsn i.on{width:22px;background:var(--accent)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-motion:reduce){.splash .w .l,.tag{opacity:1!important;transform:none!important;filter:none!important}.bar i{width:100%}}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),sleep=ms=>new Promise(r=>setTimeout(r,ms)),mem={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const svg=p=>`<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg></span>`;
const I={
key:svg('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>'),api:svg('<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>'),
msg:svg('<path d="M4 5h16v11H9l-5 4z"/>'),ai:svg('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>'),
jb:svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 017.5-2"/>'),ch:svg('<rect x="3" y="8" width="18" height="9" rx="4"/><path d="M8 11v3M6.5 12.5h3M15.5 12h.01M17.5 13.5h.01"/>'),
nt:svg('<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/>'),lk:svg('<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'),
mic:svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>'),
home:svg('<path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/>'),set:svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
plus:svg('<path d="M12 5v14M5 12h14"/>'),chev:svg('<path d="M9 6l6 6-6 6"/>'),back:svg('<path d="M15 6l-6 6 6 6"/>'),copy:svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>'),
eye:svg('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),send:svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),stop:svg('<rect x="7" y="7" width="10" height="10" rx="2"/>'),
hist:svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),trash:svg('<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'),
face:svg('<path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2M9 10v1.5M15 10v1.5M12 10v3.5h-1M9 16.5c1.5 1.2 4.5 1.2 6 0"/>'),
lock:svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>'),dice:svg('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01"/>')};
function toast(t){const n=$('#toast');n.textContent=t;n.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('on'),1800)}
async function copy(t,sec){try{await navigator.clipboard.writeText(t);toast(sec?'Copiado · limpa em 30 s':'Copiado');if(sec){clearTimeout(copy.t);copy.t=setTimeout(()=>{try{navigator.clipboard.writeText('')}catch(e){}},30000)}}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();toast(ok?'Copiado':'Não foi possível copiar')}}
function sheet(html,mount){closeSheet();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;o.onclick=e=>{if(e.target===o)closeSheet()};document.body.appendChild(o);if(mount)mount(o.firstElementChild)}
function closeSheet(){$$('.ov').forEach(n=>n.remove())}

/* cripto */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pwKey(pw,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesEnc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}}
async function aesDec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
const dataKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);

/* estado */
let meta={};try{meta=JSON.parse(store.get('ganix.meta')||'{}')||{}}catch(e){}
const saveMeta=()=>store.set('ganix.meta',JSON.stringify(meta));
let S={},ui={tab:'home',section:null,q:''};
const MODELS=['llama-3.3-70b-versatile','llama-3.1-8b-instant','openai/gpt-oss-120b','openai/gpt-oss-20b'];
const defaultDb=()=>({items:{pw:[],api:[],msg:[],nt:[],lk:[],jb:[],ch:[]},chats:[],settings:{groqKey:'',model:MODELS[0],models:MODELS.slice(),temp:.7,maxTokens:2048,stream:true,system:'',lock:0,cur:null,speak:true}});
function mergeDb(d){const b=defaultDb();d.items=Object.assign(b.items,d.items||{});d.chats=d.chats||[];d.settings=Object.assign(b.settings,d.settings||{});return d}
async function persist(){store.set('ganix.vault',JSON.stringify(await aesEnc(S.key,enc.encode(JSON.stringify(S.db)))))}
async function loadDb(){const o=JSON.parse(store.get('ganix.vault')||'null');S.db=o?mergeDb(JSON.parse(dec.decode(await aesDec(S.key,o)))):defaultDb()}
async function createAccount(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),raw=crypto.getRandomValues(new Uint8Array(32)),wk=await pwKey(pw,salt);meta.salt=b64(salt);meta.wrapped=await aesEnc(wk,raw);saveMeta();S.raw=raw;S.key=await dataKey(raw);S.db=defaultDb();await persist()}
async function unlockPw(pw){const wk=await pwKey(pw,unb64(meta.salt));S.raw=await aesDec(wk,meta.wrapped);S.key=await dataKey(S.raw);await loadDb()}
async function changePw(o,n){await aesDec(await pwKey(o,unb64(meta.salt)),meta.wrapped);const salt=crypto.getRandomValues(new Uint8Array(16));meta.salt=b64(salt);meta.wrapped=await aesEnc(await pwKey(n,salt),S.raw);saveMeta()}

/* Face ID real: WebAuthn (plataforma) + PRF para cifrar a chave do cofre; plugin nativo Capacitor se existir */
const PRFS=enc.encode('ganix-prf-v1');
const bio={
  plugin(){return window.Capacitor?.Plugins?.BiometricAuth||null},
  async available(){const p=this.plugin();if(p){try{return !!(await p.checkBiometry()).isAvailable}catch(e){return false}}

function particles(c,rm){

  w=c.clientWidth;h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#8AB4FF';
  const P=Array.from({length:rm?0:70},()=>({a:Math.random()*6.28,d:Math.max(w,h)*(.4+Math.random()*.4),s:.4+Math.random()*1.6,v:.6+Math.random()*.9}));
  const t0=performance.now();
  const f=t=>{if(!run)return;const k=Math.min((t-t0)/2200,1),e=1-Math.pow(1-k,3);x.clearRect(0,0,w,h);x.fillStyle=col;
    for(const p of P){const r=p.d*(1-e*.93),a=p.a+e*p.v*3;x.globalAlpha=.15+.6*e*(1-k*.4);x.beginPath();x.arc(w/2+Math.cos(a)*r,h/2+Math.sin(a)*r*.8,p.s,0,6.283);x.fill()}
    raf=requestAnimationFrame(f)};
  raf=requestAnimationFrame(f);return()=>{run=false;cancelAnimationFrame(raf)}}

function setBusy(b){busy=b;const cs=$('#cs');if(!cs)return;cs.innerHTML=b?I.stop:I.send;cs.setAttribute('aria-label',b?'Parar':'Enviar')}
async function sendMsg(c,text){
  const s=S.db.settings,msgs=$('#msgs');const g=$('.greet',msgs);if(g)g.remove();
  c.msgs.push({role:'user',content:text});if(c.msgs.length===1)c.title=text.slice(0,42);
  msgs.insertAdjacentHTML('beforeend',msgHtml(c.msgs[c.msgs.length-1],-1));
  const box=document.createElement('div');box.className='msg a';box.innerHTML='<div class="md"><span class="dots"></span></div>';msgs.appendChild(box);msgs.scrollTop=msgs.scrollHeight;const out=$('.md',box);
  const finish=async txt=>{c.ts=Date.now();if(txt){c.msgs.push({role:'assistant',content:txt});box.outerHTML=msgHtml(c.msgs[c.msgs.length-1],c.msgs.length-1)}else box.remove();setBusy(false);ctrl=null;await persist();const mm=$('#msgs');if(mm)mm.scrollTop=mm.scrollHeight};
  if(!s.groqKey){out.innerHTML=md('Falta a chave API do Groq. Adiciona-a em **Definições**.');c.msgs.pop();return}
  setBusy(true);ctrl=new AbortController();
  const body={model:s.model,temperature:+s.temp,max_tokens:+s.maxTokens,stream:!!s.stream,messages:[...(s.system?[{role:'system',content:s.system}]:[]),...c.msgs.map(m=>({role:m.role,content:m.content}))]};
  let acc='';
  try{
    const r=await fetch(GROQ+'/chat/completions',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.groqKey},body:JSON.stringify(body)});
    if(!r.ok){let m='Erro '+r.status;try{m=(await r.json()).error?.message||m}catch(e){}throw new Error(m)}
    if(body.stream){const rd=r.body.getReader(),td=new TextDecoder();let buf='';
      for(;;){const{done,value}=await rd.read();if(done)break;buf+=td.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
        for(const ln of lines){const t=ln.trim();if(!t.startsWith('data:'))continue;const d=t.slice(5).trim();if(d==='[DONE]')continue;
          try{const x=JSON.parse(d).choices?.[0]?.delta?.content;if(x){acc+=x;out.innerHTML=md(acc);msgs.scrollTop=msgs.scrollHeight}}catch(e){}}}
    }else acc=(await r.json()).choices?.[0]?.message?.content||'';
    await finish(acc);
  }catch(e){
    if(e.name==='AbortError')await finish(acc);
    else{c.msgs.pop();out.innerHTML=md(acc||('Não foi possível obter resposta. Confirma a internet e a chave Groq.\n\n'+(e.message||'')));if(acc){c.msgs.push({role:'user',content:text});await finish(acc)}else{setBusy(false);ctrl=null;await persist()}}
  }
}

/* Links: análise de segurança + HTML */
const SHORT=/^(bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|cutt\.ly|rb\.gy|ow\.ly|shorturl\.at)$/,TRUST=/(^|\.)(google|microsoft|apple|github|wikipedia|amazon|paypal|openai|anthropic|youtube)\.(com|org)$/;
function normUrl(s){s=s.trim();if(!/^https?:\/\//i.test(s))s='https://'+s;return new URL(s)}
function scoreUrl(u){const R=[];let n=0;const add=(p,t)=>{n+=p;R.push(t)},h=u.hostname.toLowerCase();
  if(u.protocol==='http:')add(2,'Sem HTTPS: a ligação não é cifrada.');
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(h)||h.includes(':'))add(3,'Endereço IP em vez de domínio.');
  if(u.username||u.href.replace(/^https?:\/\//,'').split('/')[0].includes('@'))add(3,'Contém "@", truque para disfarçar o destino.');
  if(h.includes('xn--'))add(3,'Domínio com caracteres disfarçados (punycode).');
  if(SHORT.test(h))add(2,'Link encurtado: o destino está escondido.');
  if(/\.(zip|mov|xyz|top|tk|ml|ga|cf|gq|click|work|support|country|kim|icu)$/.test(h))add(2,'Terminação de domínio muito usada em fraude.');
  if(h.split('.').length>4)add(1,'Demasiados subdomínios.');
  if((h.match(/-/g)||[]).length>2)add(1,'Muitos hífenes no domínio.');
  if(/login|verify|secure|account|wallet|update|banco|bank|signin|recover/.test(h+u.pathname)&&!TRUST.test(h))add(1,'Palavras típicas de phishing.');
  if(u.href.length>120)add(1,'Endereço muito longo.');
  if(u.port&&!['80','443'].includes(u.port))add(1,'Porta invulgar.');
  if(!R.length)R.push('O endereço não tem sinais de alerta.');
  return{n,R}}
function scoreHtml(html,u){const R=[];let n=0;const add=(p,t)=>{n+=p;R.push(t)};
  const d=new DOMParser().parseFromString(html,'text/html'),trusted=TRUST.test(u.hostname);
  const pw=d.querySelector('input[type=password]');
  if(pw){let ext=false;try{const a=pw.form?.getAttribute('action');ext=!!a&&new URL(a,u).hostname!==u.hostname}catch(e){}
    if(ext)add(3,'Formulário de palavra-passe envia dados para outro domínio.');else if(!trusted)add(1,'A página pede palavra-passe.')}
  if([...d.querySelectorAll('iframe')].some(f=>/display:\s*none|visibility:\s*hidden/i.test(f.getAttribute('style')||'')||f.getAttribute('width')==='0'||f.getAttribute('height')==='0'))add(2,'Iframe escondido.');
  const js=[...d.scripts].map(s=>s.textContent).join('\n');
  if(/eval\(|atob\(|unescape\(|fromCharCode/.test(js))add(2,'Código ofuscado ou dinâmico nos scripts.');
  if(d.querySelector('meta[http-equiv=refresh i]'))add(1,'Redireciona automaticamente.');
  if(d.scripts.length>25)add(1,'Muitos scripts ('+d.scripts.length+').');
  if([...d.querySelectorAll('a[href]')].some(a=>/\.(exe|apk|scr|msi|bat|dmg)(\?|$)/i.test(a.getAttribute('href'))))add(2,'Oferece ficheiros executáveis para descarregar.');
  R.push(`Verificada a página: ${d.querySelectorAll('a').length} links, ${d.scripts.length} scripts, ${d.forms.length} formulários.`);
  return{n,R}}
async function getHtml(url){
  const cap=window.Capacitor?.Plugins?.CapacitorHttp;
  if(cap){const r=await cap.get({url,readTimeoutMs:12000});return typeof r.data==='string'?r.data:JSON.stringify(r.data)}
  for(const t of [url,'https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?'+encodeURIComponent(url)]){
    try{const c=new AbortController(),id=setTimeout(()=>c.abort(),12000);const r=await fetch(t,{signal:c.signal});clearTimeout(id);if(r.ok){const x=await r.text();if(x)return x}}catch(e){}}
  throw new Error('Sem acesso ao site (bloqueado pelo browser ou offline).')}
const verdict=(n,partial)=>n>=4?{k:'bad',t:'Perigoso'}:n>=2?{k:'warn',t:'Atenção'}:{k:'ok',t:partial?'Parece seguro (só o endereço)':'Parece seguro'};
async function analyze(raw){const u=normUrl(raw),a=scoreUrl(u);let html=null;
  try{html=await getHtml(u.href);const b=scoreHtml(html,u);a.n+=b.n;a.R.push(...b.R)}catch(e){a.R.push('Conteúdo não verificado: '+e.message)}
  return{u,n:a.n,R:a.R,html,v:verdict(a.n,!html)}}
let L=null;
function viewLinks(){
  const m=$('#main');
  m.innerHTML=`<header class="top"><h1>Links</h1></header><div class="scroll"><form id="lkf" class="inwrap"><input class="in" id="lku" type="url" inputmode="url" placeholder="Cola um link" autocapitalize="off" spellcheck="false" value="${esc(L?.u.href||'')}"><button class="btn primary" id="lkg" type="submit">Analisar</button></form><span class="hint">Nada é executado. Só lemos o código para o analisar. A análise não garante segurança total.</span><div id="lres"></div></div>`;

    box.innerHTML=`<div class="verd ${r.v.k}"><h3>${r.v.t}</h3><div class="muted" style="font-size:13px;overflow-wrap:anywhere">${esc(r.u.href)}</div><ul>${r.R.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="row">${r.html?'<button class="btn" id="lh">Copiar HTML</button><button class="btn" id="lv">Ver código</button>':''}<button class="btn" id="ls">Guardar link</button><button class="btn" id="lo">Abrir</button></div>`;
    if(r.html){$('#lh').onclick=()=>copy(r.html);$('#lv').onclick=()=>sheet(`<h2>Código-fonte</h2><textarea class="in" rows="14" readonly spellcheck="false" style="font:12px ui-monospace,monospace">${esc(r.html.slice(0,60000))}</textarea><p class="hint">${r.html.length>60000?'Mostrado só o início. "Copiar HTML" copia tudo.':''}</p><button class="btn primary" id="lc" style="width:100%">Copiar tudo</button>`,x=>{$('#lc',x).onclick=()=>copy(r.html)})}
    $('#ls').onclick=()=>openItem('lk',null,{title:r.u.hostname,url:r.u.href,notes:'Análise: '+r.v.t});
    $('#lo').onclick=()=>{if(r.v.k==='bad'&&!confirm('Este link foi marcado como perigoso. Abrir mesmo assim?'))return;window.open(r.u.href,'_blank','noopener,noreferrer')}};
  $('#lkf').onsubmit=async e=>{e.preventDefault();const v=$('#lku').value.trim();if(!v)return;$('#lkg').disabled=true;$('#lres').innerHTML='<p class="muted">A analisar…</p>';
    try{L=await analyze(v);draw()}catch(x){$('#lres').innerHTML='<p class="err">Endereço inválido.</p>'}$('#lkg').disabled=false};
  draw();
}

let J={log:[],hist:[],rec:null};
function say(t){const s=S.db?.settings;if(!s?.speak||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*#`_]/g,''));u.lang='pt-PT';const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('pt'));if(v)u.voice=v;speechSynthesis.speak(u)}
function jdraw(){const b=$('#jl');if(!b)return;b.innerHTML=J.log.length?J.log.map(m=>msgHtml(m,-1)).join(''):'<div class="greet"><p class="muted" style="margin:0">Diz: "que horas são", "analisa google.com", "anota comprar leite", "abre o cofre", "bloquear" ou pergunta o que quiseres.</p></div>';b.scrollTop=b.scrollHeight}
function jpush(role,content){J.log.push({role,content});jdraw()}
function orb(on){const o=$('#orb');if(o)o.classList.toggle('on',!!on)}
async function jarvis(text){
  jpush('user',text);const t=text.toLowerCase();let r=null,mt;
  try{
    if(/que horas|\bhoras\b/.test(t))r='São '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})+'.';
    else if(/\b(data|dia de hoje|que dia)\b/.test(t))r='Hoje é '+new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
    else if(/bloque/.test(t)){say('A bloquear.');return lockNow()}
    else if(mt=t.match(/abr[ae]r?\s+(?:o\s+|a\s+)?(cofre|ia|links?|defini)/)){go({cofre:'home',ia:'ai',link:'lnk',links:'lnk',defini:'set'}[mt[1]]);return}
    else if(mt=text.match(/(?:analisa|analisar|verifica|verificar)\s+(?:o\s+link\s+)?(\S+\.\S+)/i)){const a=await analyze(mt[1]);L=a;r=`${a.v.t}. ${a.R.slice(0,3).join(' ')}`}
    else if(mt=text.match(/^(?:anota|nota)\s*:?\s+(.+)/i)){S.db.items.nt.push({id:uid(),ts:Date.now(),title:mt[1].slice(0,40),body:mt[1]});await persist();r='Nota guardada.'}
    else{J.hist.push({role:'user',content:text});J.hist=J.hist.slice(-10);
      r=await groq([{role:'system',content:'És o Jarvis, assistente pessoal elegante e eficiente dentro da app Ganix. Respondes em português de Portugal, em no máximo 3 frases curtas, sem markdown.'},...J.hist]);J.hist.push({role:'assistant',content:r})}
  }catch(e){r='Falhou: '+e.message}
  jpush('assistant',r);say(r);
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voz indisponível aqui. Escreve o pedido.');
  if(J.rec){J.rec.stop();return}try{speechSynthesis.cancel()}catch(e){}
  const r=new SR();r.lang='pt-PT';r.interimResults=false;r.onstart=()=>orb(1);r.onend=()=>{J.rec=null;orb(0)};r.onerror=()=>toast('Não percebi. Tenta outra vez.');r.onresult=e=>jarvis(e.results[0][0].transcript);J.rec=r;r.start()}

  $('#exp').onclick=()=>{const txt=JSON.stringify({v:1,salt:meta.salt,wrapped:meta.wrapped,vault:store.get('ganix.vault')});
    sheet(`<h2>Cópia de segurança</h2><div class="f"><textarea class="in" id="bk" rows="6" readonly>${esc(txt)}</textarea><span class="hint">Guarda este texto num sítio seguro.</span></div><button class="btn primary" id="bkc" style="width:100%">Copiar</button>`,root=>{$('#bkc',root).onclick=()=>copy(txt)})};
  $('#imp').onclick=()=>sheet(`<h2>Restaurar cópia</h2><div class="f"><textarea class="in" id="ibk" rows="6" placeholder="Cola aqui o texto da cópia" spellcheck="false"></textarea><span class="hint">Substitui os dados atuais. Entras com a palavra-passe da cópia.</span></div><button class="btn primary" id="ibg" style="width:100%">Restaurar</button><p class="err" id="ierr" role="alert"></p>`,root=>{
    $('#ibg',root).onclick=()=>{try{const o=JSON.parse($('#ibk',root).value);if(!o.salt||!o.wrapped||typeof o.vault!=='string')throw 0;
      meta.salt=o.salt;meta.wrapped=o.wrapped;disableBio();store.set('ganix.vault',o.vault);closeSheet();showLock(false)}catch(e){$('#ierr',root).textContent='Texto inválido.'}}});
  $('#wipe').onclick=()=>sheet(`<h2>Apagar tudo</h2><p class="muted" style="margin-top:0">Remove o cofre, conversas e definições deste dispositivo. Não dá para desfazer.</p><div class="row"><button class="btn" id="wn">Cancelar</button><button class="btn danger" id="wy">Apagar tudo</button></div>`,root=>{
    $('#wn',root).onclick=closeSheet;$('#wy',root).onclick=()=>{['ganix.meta','ganix.vault'].forEach(store.del);meta={};L=null;J.log=[];J.hist=[];closeSheet();applyPrefs();showSetup()}});
}

/* bloqueio automático */
document.addEventListener('visibilitychange',()=>{if(!S.db)return;const lim=S.db.settings.lock;
  if(document.hidden){S.hiddenAt=Date.now();if(lim===0)lockNow()}else if(S.hiddenAt!=null){if(lim>=0&&Date.now()-S.hiddenAt>=lim*1000)lockNow();S.hiddenAt=null}});
/* envio de formulários sem depender do browser (alguns visualizadores bloqueiam submit) */
const fire=f=>{if(typeof f.onsubmit==='function')f.onsubmit(new Event('submit',{cancelable:true}));else if(f.requestSubmit)f.requestSubmit()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.form||b.type!=='submit'||b.disabled)return;e.preventDefault();fire(b.form)},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const t=e.target;if(t.tagName==='INPUT'&&t.form&&!['button','submit','checkbox','radio'].includes(t.type)){e.preventDefault();fire(t.form)}},true);
boot();
})();
</script></body></html>
